services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: worldcupplanner-sqlserver
    user: root
    environment:
      SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - ./data:/var/opt/mssql/data
